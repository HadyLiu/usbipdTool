# 主分支推送仅触发一次运行：编译测试 → 检查同提交版本标签 → 条件发布。
name: CI and Release

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支的任务串行执行；只由分支推送触发，不再单独监听 tag push。
concurrency:
  group: usbipd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test, cross-compile, and optionally release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout exact build commit with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Image name (lowercase)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Resolve toolchain image fingerprint
        id: toolchain
        run: |
          set -euo pipefail
          chmod +x script/build-image.sh script/build.sh
          FP=$(./script/build-image.sh --print-fingerprint)
          IMAGE="${IMAGE_NAME}:toolchain-${FP}"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Resolved compiler toolchain image $IMAGE"

      # Same-repo push/PR may log in to pull a private GHCR package. Fork PRs do not
      # get a login (no publish credentials) and fall back to an anonymous pull or a local build.
      - name: Log in to GHCR
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull prebuilt toolchain or build on cache miss
        id: image
        run: |
          set -euo pipefail
          BUILT=false
          if docker pull "$IMAGE"; then
            echo "Pulled prebuilt toolchain $IMAGE; will compile the app only."
          else
            echo "No prebuilt image for this Dockerfile fingerprint; building with script/build-image.sh"
            ./script/build-image.sh
            BUILT=true
          fi
          echo "built=$BUILT" >> "$GITHUB_OUTPUT"

      # Publish the immutable fingerprint tag only from a trusted main/master push,
      # and only when this run actually built the image. Fork/PR never publish.
      - name: Publish toolchain image on cache miss
        if: github.event_name == 'push' && steps.image.outputs.built == 'true'
        run: docker push "$IMAGE"

      - name: Test and produce UsbipdTool.exe
        run: ./script/build.sh

      - name: Find version tag on this exact built commit
        id: version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PACKAGE_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          TAG="v${PACKAGE_VERSION}"
          # 不使用 latest tag：只接受与已编译版本一致，且精确指向已构建 SHA 的标签。
          if git show-ref --verify --quiet "refs/tags/$TAG" && \
             [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$GITHUB_SHA" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No matching version tag on $GITHUB_SHA; artifacts only."
          fi

      - name: SHA256 checksum
        run: (cd dist && sha256sum UsbipdTool.exe > UsbipdTool.exe.sha256)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UsbipdTool-${{ github.sha }}
          path: |
            dist/UsbipdTool.exe
            dist/UsbipdTool.exe.sha256
          if-no-files-found: error

      - name: Create or update Release for the exact built tag
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          FILES=(dist/UsbipdTool.exe dist/UsbipdTool.exe.sha256)
          MARKER="<!-- usbipd-build-sha: ${GITHUB_SHA} -->"
          if gh release view "$TAG" >/dev/null 2>&1; then
            BODY=$(gh release view "$TAG" --json body --jq .body)
            if [[ "$BODY" == *"$MARKER"* ]]; then
              echo "This commit is already released; skipping duplicate publication."
            else
              gh release upload "$TAG" "${FILES[@]}" --clobber
              printf '%s\n\n%s\n' "$BODY" "$MARKER" > "$RUNNER_TEMP/release-notes.md"
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            fi
          else
            gh release create "$TAG" "${FILES[@]}" --verify-tag \
              --title "UsbipdTool ${TAG}" --generate-notes --notes "$MARKER"
          fi

      # Login already ran at the start of this trusted push job when a version tag is present.
      - name: Push versioned build image
        if: steps.version.outputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE" "${IMAGE_NAME}:${VERSION}"
          docker tag "$IMAGE" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:latest"
